name = "vyuhapot-core"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Dual-domain deception and administrative routing
routes = [
  { pattern = "pot.vyuha.me/*", zone_name = "vyuha.me" },
  { pattern = "vault.vyuha.me/*", zone_name = "vyuha.me" }
]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "vyuhapot-telemetry"
database_id = "d1-vyuhapot-001"

